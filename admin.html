<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — MK Corporation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface2: #334155;
            --border: #475569;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --radius: 12px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh;
        }

        /* LOGIN */
        .login-screen {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 2rem;
        }
        .login-card {
            background: var(--surface); border-radius: 20px;
            padding: 3rem; width: 100%; max-width: 420px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }
        .login-card h1 {
            text-align: center; margin-bottom: 0.5rem; font-size: 1.5rem;
        }
        .login-card p {
            text-align: center; color: var(--text-muted); margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block; font-size: 0.85rem; font-weight: 600;
            color: var(--text-muted); margin-bottom: 0.5rem;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .form-input {
            width: 100%; padding: 12px 16px; border-radius: 10px;
            border: 2px solid var(--border); background: var(--bg);
            color: var(--text); font-size: 1rem; font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-input:focus { outline: none; border-color: var(--accent); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; padding: 12px 24px; border-radius: 10px;
            font-weight: 600; font-size: 0.95rem; cursor: pointer;
            border: none; transition: all 0.3s; font-family: inherit;
        }
        .btn-primary { background: var(--accent); color: white; width: 100%; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 8px 16px; font-size: 0.85rem; }
        .btn-outline {
            background: transparent; color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .btn-outline:hover { border-color: var(--text); color: var(--text); }

        /* ADMIN PANEL */
        .admin-panel { display: none; }

        /* Sidebar */
        .sidebar {
            position: fixed; left: 0; top: 0; width: 260px; height: 100vh;
            background: var(--surface); border-right: 1px solid var(--border);
            padding: 1.5rem; display: flex; flex-direction: column; z-index: 100;
        }
        .sidebar-logo {
            display: flex; align-items: center; gap: 12px;
            padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem;
        }
        .sidebar-logo-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            display: flex; align-items: center; justify-content: center; color: white; font-size: 1.1rem;
        }
        .sidebar-logo-text { font-weight: 700; font-size: 1rem; }
        .sidebar-logo-text span { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 400; }

        .sidebar-nav { list-style: none; flex: 1; }
        .sidebar-nav li { margin-bottom: 4px; }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px;
            color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;
        }
        .sidebar-nav a:hover, .sidebar-nav a.active {
            background: rgba(59,130,246,0.1); color: var(--accent);
        }
        .sidebar-nav a i { width: 20px; text-align: center; }

        .sidebar-footer { padding-top: 1rem; border-top: 1px solid var(--border); }

        /* Main Content */
        .main { margin-left: 260px; padding: 2rem; }
        .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .main-header h2 { font-size: 1.5rem; }

        /* Cards */
        .card {
            background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
            padding: 1.5rem; margin-bottom: 1.5rem;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;
            padding-bottom: 1rem; border-bottom: 1px solid var(--border);
        }
        .card-header h3 { font-size: 1.1rem; }

        /* Photo Grid */
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .photo-item {
            position: relative; border-radius: 12px; overflow: hidden; background: var(--bg);
            border: 1px solid var(--border); transition: all 0.3s;
        }
        .photo-item:hover { border-color: var(--accent); transform: translateY(-2px); }
        .photo-item img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .photo-info { padding: 10px 12px; }
        .photo-info .name { font-size: 0.8rem; font-weight: 600; word-break: break-all; margin-bottom: 4px; }
        .photo-info .size { font-size: 0.75rem; color: var(--text-muted); }
        .photo-actions { display: flex; gap: 6px; padding: 0 12px 10px; }
        .photo-actions button {
            flex: 1; padding: 6px; border-radius: 8px; border: none; font-size: 0.75rem;
            cursor: pointer; font-weight: 600; transition: all 0.2s;
        }
        .photo-delete { background: rgba(239,68,68,0.15); color: var(--danger); }
        .photo-delete:hover { background: var(--danger); color: white; }

        /* Upload Area */
        .upload-area {
            border: 2px dashed var(--border); border-radius: var(--radius); padding: 3rem 2rem;
            text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 1.5rem;
        }
        .upload-area:hover, .upload-area.dragover { border-color: var(--accent); background: rgba(59,130,246,0.05); }
        .upload-area i { font-size: 2.5rem; color: var(--accent); margin-bottom: 1rem; }
        .upload-area input[type="file"] { display: none; }

        /* Upload Preview */
        .upload-preview {
            display: none; align-items: center; gap: 1rem; background: var(--bg); padding: 1rem;
            border-radius: 10px; margin-bottom: 1rem; border: 1px solid var(--border);
        }
        .upload-preview.active { display: flex; }
        .upload-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }

        /* Data Form */
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .data-grid .full-width { grid-column: 1 / -1; }

        /* Portfolio */
        .portfolio-item {
            display: flex; flex-direction: column; gap: 0.5rem; padding: 1rem;
            border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1rem;
            background: var(--bg);
        }
        .portfolio-header { display: flex; justify-content: space-between; align-items: center; }
        .portfolio-details { font-size: 0.9rem; color: var(--text-muted); display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

        /* Toast */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            padding: 12px 20px; border-radius: 10px; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center;
            gap: 10px; animation: slideIn 0.3s ease; min-width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .toast-success { background: var(--success); color: white; }
        .toast-error { background: var(--danger); color: white; }
        .toast-info { background: var(--accent); color: white; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Loading */
        .loading { display: flex; align-items: center; justify-content: center; padding: 3rem; color: var(--text-muted); }
        .spinner {
            width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .main { margin-left: 0; }
            .data-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <!-- LOGIN SCREEN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div style="text-align:center; margin-bottom:1.5rem;">
                <div style="width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#8b5cf6);display:inline-flex;align-items:center;justify-content:center;color:white;font-size:1.5rem;">
                    <i class="fas fa-plug"></i>
                </div>
            </div>
            <h1>Admin Login</h1>
            <p>MK Corporation Admin Panel</p>
            <form onsubmit="doLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-input" id="loginUser" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="loginPass" required>
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
            </form>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div class="admin-panel" id="adminPanel">
        <div class="sidebar">
            <div class="sidebar-logo">
                <div class="sidebar-logo-icon"><i class="fas fa-cogs"></i></div>
                <div class="sidebar-logo-text">
                    Admin Panel
                    <span>MK Corporation</span>
                </div>
            </div>
            <ul class="sidebar-nav">
                <li><a href="#" class="active" onclick="showTab('data')"><i class="fas fa-building"></i> Site Info</a></li>
                <li><a href="#" onclick="showTab('portfolio')"><i class="fas fa-briefcase"></i> Portfolio</a></li>
                <li><a href="#" onclick="showTab('photos')"><i class="fas fa-images"></i> Photos</a></li>
                <li><a href="#" onclick="showTab('settings')"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn btn-primary btn-sm" style="width:100%; margin-bottom:8px;" onclick="rebuildWebsite()">
                    <i class="fas fa-hammer"></i> Rebuild Website
                </button>
                <button class="btn btn-outline btn-sm" style="width:100%;" onclick="doLogout()">Logout</button>
            </div>
        </div>

        <div class="main">
            <!-- SITE INFO TAB -->
            <div class="tab-content" id="tab-data">
                <div class="main-header">
                    <h2>Site Info</h2>
                </div>
                <div class="card">
                    <form onsubmit="saveSiteData(event)">
                        <div class="data-grid" id="dataForm"></div>
                        <button type="submit" class="btn btn-primary" style="margin-top:1.5rem; width:auto;">Save Site Info</button>
                    </form>
                </div>
            </div>

            <!-- PORTFOLIO TAB -->
            <div class="tab-content" id="tab-portfolio" style="display:none;">
                <div class="main-header">
                    <h2>Portfolio Manager</h2>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>Add New Entry</h3>
                    </div>
                    <form onsubmit="addPortfolio(event)">
                        <div class="data-grid">
                            <div class="form-group"><label>Device Name</label><input type="text" id="pf-device" class="form-input" required></div>
                            <div class="form-group"><label>Icon Class (e.g. fas fa-plug)</label><input type="text" id="pf-icon" class="form-input" value="fas fa-wrench" required></div>
                            <div class="form-group"><label>Problem</label><input type="text" id="pf-problem" class="form-input" required></div>
                            <div class="form-group"><label>Solution</label><input type="text" id="pf-solution" class="form-input" required></div>
                            <div class="form-group"><label>Cost (Optional)</label><input type="text" id="pf-cost" class="form-input"></div>
                            <div class="form-group"><label>Status</label><input type="text" id="pf-status" class="form-input" value="Completed"></div>
                            <div class="form-group"><label>Date</label><input type="date" id="pf-date" class="form-input" required></div>
                            <div class="form-group"><label>Color Class</label><input type="text" id="pf-color" class="form-input" value="blue"></div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:auto;">Add Entry</button>
                    </form>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>Portfolio Entries</h3>
                    </div>
                    <div id="portfolioList"><div class="loading"><div class="spinner"></div></div></div>
                </div>
            </div>

            <!-- PHOTOS TAB -->
            <div class="tab-content" id="tab-photos" style="display:none;">
                <div class="main-header">
                    <h2>Photos</h2>
                </div>
                <div class="card">
                    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-cloud-arrow-up"></i>
                        <h4>Click to Upload Photo</h4>
                        <input type="file" id="fileInput" accept="image/*" onchange="previewFile(this)">
                    </div>
                    <div class="upload-preview" id="uploadPreview">
                        <img id="previewImg" src="">
                        <div class="info">
                            <h5 id="previewName">filename.jpg</h5>
                        </div>
                        <button class="btn btn-primary btn-sm" onclick="uploadFile()">Upload</button>
                    </div>
                </div>
                <div class="card">
                    <div id="photoGrid" class="photo-grid"><div class="loading"><div class="spinner"></div></div></div>
                </div>
            </div>

            <!-- SETTINGS TAB -->
            <div class="tab-content" id="tab-settings" style="display:none;">
                <div class="main-header">
                    <h2>Settings</h2>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>Change Password</h3>
                    </div>
                    <form onsubmit="changePassword(event)" style="max-width:400px;">
                        <div class="form-group"><label>Current Password</label><input type="password" class="form-input" id="currentPw" required></div>
                        <div class="form-group"><label>New Password</label><input type="password" class="form-input" id="newPw" required minlength="6"></div>
                        <div class="form-group"><label>Confirm New Password</label><input type="password" class="form-input" id="confirmPw" required minlength="6"></div>
                        <button type="submit" class="btn btn-primary" style="width:auto;">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = '/api';

        function toast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.innerHTML = msg;
            container.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        async function checkAuth() {
            try {
                const res = await fetch(`${API}/check-auth`);
                const data = await res.json();
                if (data.authenticated) showAdmin();
            } catch(e) {}
        }

        async function doLogin(e) {
            e.preventDefault();
            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: document.getElementById('loginUser').value, password: document.getElementById('loginPass').value})
                });
                const data = await res.json();
                if (data.success) { toast('Login successful', 'success'); showAdmin(); }
                else toast(data.message, 'error');
            } catch(e) { toast('Error logging in', 'error'); }
        }

        async function doLogout() {
            await fetch(`${API}/logout`, {method: 'POST'});
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
        }

        function showAdmin() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadSiteData();
            loadPortfolio();
            refreshPhotos();
        }

        function showTab(name) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById(`tab-${name}`).style.display = 'block';
            document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
            event.target.closest('a').classList.add('active');
        }

        async function rebuildWebsite() {
            try {
                const res = await fetch(`${API}/rebuild`, { method: 'POST' });
                if (res.ok) toast('Website rebuilt!', 'success');
                else toast('Failed to rebuild', 'error');
            } catch(e) { toast('Error rebuilding', 'error'); }
        }

        const fieldLabels = {
            business_name: 'Business Name', owner_name: 'Owner Name', tagline: 'Tagline',
            phone: 'Phone', whatsapp: 'WhatsApp', telegram: 'Telegram', email: 'Email',
            facebook: 'Facebook URL', location: 'Location', working_hours: 'Working Hours'
        };

        async function loadSiteData() {
            try {
                const res = await fetch(`${API}/data`);
                const data = await res.json();
                let html = '';
                for (const [key, label] of Object.entries(fieldLabels)) {
                    html += `<div class="form-group"><label>${label}</label><input type="text" class="form-input" name="${key}" value="${(data[key]||'').replace(/"/g, '&quot;')}"></div>`;
                }
                document.getElementById('dataForm').innerHTML = html;
            } catch(e) { toast('Error loading data', 'error'); }
        }

        async function saveSiteData(e) {
            e.preventDefault();
            const inputs = document.querySelectorAll('#dataForm input');
            const data = {};
            inputs.forEach(i => { data[i.name] = i.value; });
            try {
                const res = await fetch(`${API}/data`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
                if (res.ok) toast('Saved!', 'success');
            } catch(e) { toast('Error saving', 'error'); }
        }

        async function loadPortfolio() {
            try {
                const res = await fetch(`${API}/portfolio`);
                const data = await res.json();
                const list = document.getElementById('portfolioList');
                if (data.length === 0) { list.innerHTML = '<p>No entries found.</p>'; return; }
                list.innerHTML = data.map((p, i) => `
                    <div class="portfolio-item">
                        <div class="portfolio-header">
                            <h4><i class="${p.icon}"></i> ${p.device}</h4>
                            <button class="btn btn-danger btn-sm" onclick="deletePortfolio(${i})">Delete</button>
                        </div>
                        <div class="portfolio-details">
                            <span><b>Problem:</b> ${p.problem}</span>
                            <span><b>Solution:</b> ${p.solution}</span>
                            <span><b>Cost:</b> ${p.cost}</span>
                            <span><b>Status:</b> ${p.status}</span>
                            <span><b>Date:</b> ${p.date}</span>
                        </div>
                    </div>
                `).join('');
            } catch(e) {}
        }

        async function addPortfolio(e) {
            e.preventDefault();
            const payload = {
                device: document.getElementById('pf-device').value,
                icon: document.getElementById('pf-icon').value,
                problem: document.getElementById('pf-problem').value,
                solution: document.getElementById('pf-solution').value,
                cost: document.getElementById('pf-cost').value,
                status: document.getElementById('pf-status').value,
                date: document.getElementById('pf-date').value,
                color: document.getElementById('pf-color').value
            };
            try {
                const res = await fetch(`${API}/portfolio`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                if (res.ok) { toast('Added!', 'success'); e.target.reset(); loadPortfolio(); }
            } catch(e) { toast('Error adding', 'error'); }
        }

        async function deletePortfolio(index) {
            if(!confirm('Delete this entry?')) return;
            try {
                const res = await fetch(`${API}/portfolio/${index}`, {method: 'DELETE'});
                if (res.ok) { toast('Deleted!', 'success'); loadPortfolio(); }
            } catch(e) {}
        }

        let selectedFile = null;
        function previewFile(input) {
            const file = input.files[0];
            if (!file) return;
            selectedFile = file;
            document.getElementById('previewImg').src = URL.createObjectURL(file);
            document.getElementById('previewName').textContent = file.name;
            document.getElementById('uploadPreview').classList.add('active');
        }

        async function uploadFile() {
            if (!selectedFile) return;
            const formData = new FormData(); formData.append('file', selectedFile);
            try {
                const res = await fetch(`${API}/photos/upload`, { method: 'POST', body: formData });
                if (res.ok) {
                    toast('Uploaded!', 'success');
                    document.getElementById('uploadPreview').classList.remove('active');
                    selectedFile = null; refreshPhotos();
                } else toast('Upload failed', 'error');
            } catch(e) {}
        }

        async function refreshPhotos() {
            try {
                const res = await fetch(`${API}/photos`);
                const photos = await res.json();
                document.getElementById('photoGrid').innerHTML = photos.map(p => `
                    <div class="photo-item">
                        <img src="${p.url}">
                        <div class="photo-info"><div class="name">${p.name}</div></div>
                        <div class="photo-actions"><button class="photo-delete" onclick="deletePhoto('${p.name}')">Delete</button></div>
                    </div>
                `).join('');
            } catch(e) {}
        }

        async function deletePhoto(name) {
            if(!confirm('Delete photo?')) return;
            try {
                const res = await fetch(`${API}/photos/${encodeURIComponent(name)}`, {method: 'DELETE'});
                if (res.ok) { toast('Deleted!', 'success'); refreshPhotos(); }
            } catch(e) {}
        }

        async function changePassword(e) {
            e.preventDefault();
            const newPw = document.getElementById('newPw').value;
            const confirmPw = document.getElementById('confirmPw').value;
            if (newPw !== confirmPw) { toast('Passwords do not match', 'error'); return; }
            try {
                const res = await fetch(`${API}/change-password`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ current_password: document.getElementById('currentPw').value, new_password: newPw })
                });
                const data = await res.json();
                if (data.success) { toast('Password changed', 'success'); e.target.reset(); }
                else toast(data.error, 'error');
            } catch(e) {}
        }

        checkAuth();
    </script>
</body>
</html>
